<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Backrooms — Posto Zero</title>
    <link rel="stylesheet" href="./lobby.css" />
  </head>
  <body>
    <div id="view"></div>

    <section id="menu" class="panel">
      <h1>BACKROOMS</h1>
      <p class="sub">Posto Zero · lobby</p>
      <label for="nickname">Seu nome</label>
      <input id="nickname" maxlength="32" autocomplete="nickname" />
      <label>Personagem</label>
      <div id="skins" class="skins"></div>
      <button id="public" class="primary">Entrar no lobby público</button>
      <button id="private">Criar lobby privado</button>
      <div class="row">
        <input id="code" maxlength="6" placeholder="CÓDIGO" autocapitalize="characters" />
        <button id="join">Entrar</button>
      </div>
      <p id="menuError" class="error" role="alert"></p>
      <a class="back" href="/">Voltar ao jogo clássico</a>
    </section>

    <section id="hud" hidden>
      <div id="lobbyInfo"></div>
      <div id="help">
        WASD mover · botão direito gira a câmera · Shift correr · Espaço pular · 1 2 3 emotes ·
        Enter chat · clique num jogador para convidar · G sair do grupo
      </div>
      <div id="notice" role="status"></div>
      <div id="teamSize" hidden>
        <span id="teamSizeText">Quantos no time?</span>
        <span id="teamSizeButtons">
          <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button
          ><button data-n="4">4</button>
        </span>
      </div>
      <div id="invite" hidden>
        <span id="inviteText"></span>
        <button id="acceptInvite">Aceitar</button>
        <button id="declineInvite">Agora não</button>
      </div>
      <div id="chat">
        <ul id="chatLog"></ul>
        <input id="chatInput" maxlength="240" placeholder="Enter para conversar" hidden />
      </div>
      <div id="stick"><div id="knob"></div></div>
      <div id="touchButtons">
        <button data-key="jump">⤒</button>
        <button data-key="wave">👋</button>
        <button data-key="chat">💬</button>
      </div>
    </section>

    <section id="travel" class="panel" hidden>
      <h2>Atravessando o portal…</h2>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
